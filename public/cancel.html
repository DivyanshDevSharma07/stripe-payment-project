<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Payment Cancelled</title>
    <link
        rel="stylesheet"
        href="css/cancel.css"
    >
</head>
<body>
    <div class="container">
        <div class="cancel-card">
            <div class="warning-icon">
                ⚠
            </div>
            <h1>Payment Cancelled</h1>
            <p class="subtitle">
                Your payment was not completed.
                <br>
                No charges have been made.
            </p>
            <a
                href="/"
                class="primary-btn"
            >
                Try Again
            </a>
            <a
                href="/"
                class="secondary-btn"
            >
                Continue Shopping
            </a>
        </div>
    </div>
</body>
</html>
